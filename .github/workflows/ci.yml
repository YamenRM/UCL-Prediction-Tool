name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint (syntax errors and undefined names only)
        run: |
          # Fails only on real errors (E9, F63, F7, F82) — not style nitpicks,
          # since the goal here is catching bugs, not enforcing formatting.
          flake8 src/ --select=E9,F63,F7,F82 --show-source

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Check app.py imports cleanly
        run: python -m py_compile src/app.py